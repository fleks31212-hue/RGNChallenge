name: Build RNG Challenge

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        run: gradle -p RNGChallenge-Fabric-1.21.1-source build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RNG-Challenge-JAR
          path: RNGChallenge-Fabric-1.21.1-source/build/libs/*.jar
